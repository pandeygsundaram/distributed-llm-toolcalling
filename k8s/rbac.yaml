apiVersion: v1
kind: ServiceAccount
metadata:
  name: sendai-api
  namespace: sendai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sendai-api
  namespace: sendai
rules:
  # Pod inspection
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod exec (for worker)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Lease management (source of truth for pod locking)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sendai-api
  namespace: sendai
subjects:
  - kind: ServiceAccount
    name: sendai-api
    namespace: sendai
roleRef:
  kind: Role
  name: sendai-api
  apiGroup: rbac.authorization.k8s.io

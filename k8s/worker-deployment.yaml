apiVersion: apps/v1
kind: Deployment
metadata:
  name: sendai-worker
  namespace: sendai
spec:
  replicas: 2   # Scale independently of API; each worker processes 1 job at a time
  selector:
    matchLabels:
      app: sendai-worker
  template:
    metadata:
      labels:
        app: sendai-worker
    spec:
      serviceAccountName: sendai-api
      containers:
        - name: worker
          image: sendai:latest
          imagePullPolicy: Never
          command: ["node", "dist/worker/index.js"]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sendai-secrets
                  key: REDIS_URL
            - name: USE_REDIS
              value: "true"
            - name: K8S_NAMESPACE
              value: "sendai"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sendai-secrets
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sendai-secrets
                  key: ANTHROPIC_API_KEY
            - name: NODE_ENV
              value: "production"
            - name: LEASE_TTL_SECONDS
              value: "30"
            - name: POD_DISCOVERY_INTERVAL_MS
              value: "10000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

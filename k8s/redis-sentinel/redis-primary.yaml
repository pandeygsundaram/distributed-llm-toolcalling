apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-primary
  namespace: sendai
spec:
  serviceName: redis-primary
  replicas: 1
  selector:
    matchLabels:
      app: redis-primary
  template:
    metadata:
      labels:
        app: redis-primary
        role: primary
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - ""   # disable RDB snapshots — AOF is enough
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: sendai
spec:
  selector:
    app: redis-primary
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis    # keeps existing REDIS_URL=redis://redis:6379 working
  namespace: sendai
spec:
  selector:
    app: redis-primary
  ports:
    - port: 6379
      targetPort: 6379

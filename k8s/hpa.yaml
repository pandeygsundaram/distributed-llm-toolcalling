apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandbox-runner-hpa
  namespace: sendai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: sandbox-runner
  minReplicas: 8
  maxReplicas: 32
  metrics:
    # Scale based on queue depth — exposed by prometheus-adapter reading
    # the queue_depth gauge from GET /metrics/prometheus on sendai-api.
    # AverageValue: keep average queue depth per pod <= 2 waiting jobs.
    - type: External
      external:
        metric:
          name: sendai_queue_depth
          selector:
            matchLabels:
              namespace: sendai
        target:
          type: AverageValue
          averageValue: "2"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0    # no wait — scale immediately
      policies:
        - type: Pods
          value: 32                    # allow full jump to 32 in one shot
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120  # drain queue before shrinking
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-runner-isolation
  namespace: sendai
spec:
  podSelector:
    matchLabels:
      app: sandbox-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow kubectl exec traffic from the K8s API server
    - {}
  egress:
    # Allow DNS only — sandbox code cannot reach the internet or internal services
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
